name: Temporary formatter inspection

on:
  push:
    branches:
      - architecture/consumer-platform-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: apply oxfmt to auth migration files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: |
          pnpm exec oxfmt docs/architecture/consumer-platform-migration.md tests/internal/browser-worker.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/consumer-platform-migration.md tests/internal/browser-worker.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply oxfmt to auth migration files"
            git push
          fi
