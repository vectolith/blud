name: Temporary formatter inspection

on:
  push:
    branches:
      - architecture/consumer-platform-foundation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Print exact formatter changes
        run: |
          pnpm exec oxfmt docs/architecture/consumer-platform-migration.md tests/internal/browser-worker.test.ts
          git diff -- docs/architecture/consumer-platform-migration.md tests/internal/browser-worker.test.ts
