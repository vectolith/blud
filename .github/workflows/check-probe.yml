name: Temporary Blud diagnostics

on:
  push:
    branches: [standards/public-product-readiness]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run lint diagnostics
        run: pnpm exec oxlint . --deny-warnings || true
      - name: Run Knip diagnostics
        run: pnpm exec knip --config knip.config.ts --reporter compact || true
      - name: Run tests directly
        run: pnpm exec vitest run || true
