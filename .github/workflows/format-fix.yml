name: Format legacy Blud sources

on:
  push:
    branches: [standards/public-product-readiness]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format files reported by CI
        run: |
          pnpm exec oxfmt --write \
            "evals/browser/dashboard/app/(overview)/page.tsx" \
            "evals/browser/dashboard/app/runs/[runId]/traces/[sessionId]/page.tsx" \
            "evals/browser/dashboard/components/run-detail.tsx" \
            web/components/ai-elements/conversation.tsx \
            web/components/ai-elements/prompt-input.tsx \
            web/components/ai-elements/reasoning.tsx \
            web/components/ai-elements/tool.tsx \
            web/components/browser/activity-duration-breakdown.tsx \
            web/components/ui/field.tsx \
            web/components/ui/select.tsx \
            web/components/ui/sidebar.tsx \
            web/components/ui/switch.tsx \
            web/components/ui/tooltip.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "evals/browser/dashboard/app/(overview)/page.tsx" "evals/browser/dashboard/app/runs/[runId]/traces/[sessionId]/page.tsx" "evals/browser/dashboard/components/run-detail.tsx" web/components
            git commit -m "style: format legacy dashboard and UI sources"
            git push origin HEAD:${{ github.ref_name }}
          fi
