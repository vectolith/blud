name: Integration migration tests once

on:
  push:
    branches:
      - architecture/consumer-platform-foundation

permissions:
  contents: read

jobs:
  integration-tests:
    if: contains(github.event.head_commit.message, 'run integration migration tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/consumer-platform-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run db/tests/integration-migration.test.ts integrations/credential-encryption.test.ts integrations/registry.test.ts
