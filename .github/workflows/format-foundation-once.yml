name: Format foundation files once

on:
  push:
    branches:
      - architecture/consumer-platform-foundation

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, 'format once')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/consumer-platform-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt integrations/credential-encryption.test.ts db/services/integrations/credentials.ts knip.config.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/credential-encryption.test.ts db/services/integrations/credentials.ts knip.config.ts
          git commit -m "style: format credential persistence code"
          git push origin HEAD:architecture/consumer-platform-foundation
