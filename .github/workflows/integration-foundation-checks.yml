name: Integration foundation focused checks

on:
  push:
    branches:
      - architecture/consumer-platform-foundation

permissions:
  contents: read

jobs:
  focused-checks:
    if: contains(github.event.head_commit.message, 'focused integration checks')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/consumer-platform-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check db/schema/integrations.ts db/tests/integration-migration.test.ts db/services/integrations/credentials.ts integrations/credential-encryption.ts integrations/credential-encryption.test.ts integrations/registry.ts integrations/registry.test.ts
      - run: pnpm exec oxlint db/schema/integrations.ts db/tests/integration-migration.test.ts db/services/integrations/credentials.ts integrations/credential-encryption.ts integrations/credential-encryption.test.ts integrations/registry.ts integrations/registry.test.ts --deny-warnings
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm exec vitest run db/tests/integration-migration.test.ts integrations/credential-encryption.test.ts integrations/registry.test.ts
