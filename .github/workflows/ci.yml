name: Blud CI

on:
  push:
    branches:
      - main
      - fix/fail-closed-browser-worker
      - chore/public-standard-quality-stacked
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blud-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 20
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full check suite (oxlint, typecheck, vitest, oxfmt, knip)
        run: pnpm check

      - name: Build production application
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm build
