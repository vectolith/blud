name: Blud CI

on:
  push:
    branches:
      - main
      - fix/fail-closed-browser-worker
      - chore/public-standard-quality-stacked
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: blud-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 20
    name: Lint, Typecheck & Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full check suite (oxlint, typecheck, vitest, oxfmt, knip)
        run: pnpm check

      - name: Build production application
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm build
