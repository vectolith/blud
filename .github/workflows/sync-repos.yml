name: Auto-Sync Repositories (pluco-dev/blud <-> ganiyucall911/blud)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror push to peer repository
        env:
          SYNC_PAT: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "Notice: REPO_SYNC_TOKEN secret not configured. Local dual-remote git push keeps both repositories synced automatically."
            exit 0
          fi
          if [ "${{ github.repository }}" = "pluco-dev/blud" ]; then
            TARGET_REPO="ganiyucall911/blud"
          else
            TARGET_REPO="pluco-dev/blud"
          fi
          git push --force "https://x-access-token:${SYNC_PAT}@github.com/${TARGET_REPO}.git" HEAD:refs/heads/main
