name: Audit branch formatter

on:
  push:
    branches: [audit/ci-and-security-repairs]

permissions:
  contents: write

concurrency:
  group: audit-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatter
        run: pnpm format

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format encryption rotation changes"
          git push
